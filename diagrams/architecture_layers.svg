<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .ttl { font-size: 22px; font-weight: 700; fill: #7D8590; }
    .sub { font-size: 13px; fill: #8B949E; }
    .code { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
    .lname { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .litem { font-size: 12.5px; fill: #E9EEF5; }
    .rlab { font-size: 11.5px; fill: #8B949E; }
    .rhead { font-size: 12px; font-weight: 700; fill: #8B949E; }
  </style>

  <text x="40" y="38" class="ttl">Home Lab Architecture</text>
  <text x="40" y="58" class="sub">Four layers, ordered by blast radius. Lower layers fail louder.</text>

  <!-- right column header -->
  <text x="712" y="92" class="rhead">IF THIS LAYER FAILS</text>

  <!-- L3 -->
  <g>
    <rect x="40" y="100" width="650" height="98" rx="8" fill="#6E56A8"/>
    <rect x="40" y="100" width="56" height="98" rx="8" fill="#59448C"/>
    <rect x="88" y="100" width="8" height="98" fill="#59448C"/>
    <text x="68" y="156" class="code" text-anchor="middle">L3</text>
    <text x="116" y="130" class="lname">Knowledge and Agent Layer</text>
    <text x="116" y="154" class="litem">Agent Rooms v2 over SQLite  ·  Claude Code  ·  Codex CLI  ·  OpenClaw</text>
    <text x="116" y="176" class="litem">Central knowledge vault as shared memory and export target</text>
    <text x="712" y="140" class="rlab">Automation and documentation</text>
    <text x="712" y="158" class="rlab">workflow stops. No production</text>
    <text x="712" y="176" class="rlab">impact.</text>
  </g>

  <!-- L2 -->
  <g>
    <rect x="40" y="216" width="650" height="98" rx="8" fill="#2E7D6B"/>
    <rect x="40" y="216" width="56" height="98" rx="8" fill="#236154"/>
    <rect x="88" y="216" width="8" height="98" fill="#236154"/>
    <text x="68" y="272" class="code" text-anchor="middle">L2</text>
    <text x="116" y="246" class="lname">Observability and Operations</text>
    <text x="116" y="270" class="litem">Metrics  ·  uptime checks  ·  custom security event collector</text>
    <text x="116" y="292" class="litem">External dead man switch  ·  out of band alerting  ·  status dashboard</text>
    <text x="712" y="256" class="rlab">Everything keeps running but</text>
    <text x="712" y="274" class="rlab">blind. Silent failures, no</text>
    <text x="712" y="292" class="rlab">alerts.</text>
  </g>

  <!-- L1 -->
  <g>
    <rect x="40" y="332" width="650" height="98" rx="8" fill="#2F6FB5"/>
    <rect x="40" y="332" width="56" height="98" rx="8" fill="#245691"/>
    <rect x="88" y="332" width="8" height="98" fill="#245691"/>
    <text x="68" y="388" class="code" text-anchor="middle">L1</text>
    <text x="116" y="362" class="lname">Compute and Virtualization</text>
    <text x="116" y="386" class="litem">Proxmox VE on a small form factor node</text>
    <text x="116" y="408" class="litem">Guests: Rocky Linux (RHCSA)  ·  Home Assistant OS  ·  Docker host</text>
    <text x="712" y="372" class="rlab">Lab services and home</text>
    <text x="712" y="390" class="rlab">automation stop. Partly a</text>
    <text x="712" y="408" class="rlab">household dependency.</text>
  </g>

  <!-- L0 -->
  <g>
    <rect x="40" y="448" width="650" height="98" rx="8" fill="#B5622F"/>
    <rect x="40" y="448" width="56" height="98" rx="8" fill="#8F4C24"/>
    <rect x="88" y="448" width="8" height="98" fill="#8F4C24"/>
    <text x="68" y="504" class="code" text-anchor="middle">L0</text>
    <text x="116" y="478" class="lname">Physical and Network</text>
    <text x="116" y="502" class="litem">Rack  ·  fiber service  ·  ISP gateway  ·  Gigabit switching</text>
    <text x="116" y="524" class="litem">Wi–Fi 7 mesh in access point mode  ·  Tailscale overlay for remote access</text>
    <text x="712" y="488" class="rlab">Whole household offline.</text>
    <text x="712" y="506" class="rlab">Highest blast radius, lowest</text>
    <text x="712" y="524" class="rlab">tolerance for experiments.</text>
  </g>

  <!-- blast radius arrow -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B949E"/>
    </marker>
  </defs>
  <line x1="22" y1="112" x2="22" y2="534" stroke="#8B949E" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="16" y="330" class="rlab" text-anchor="middle" transform="rotate(-90 16 330)">blast radius increases</text>
</svg>
